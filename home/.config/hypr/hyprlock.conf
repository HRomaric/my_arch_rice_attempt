$font = JetBrainsMono Nerd Font
$text = rgba(205, 214, 224, 0.75)

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/porsche-lock.png
    blur_passes = 0
}

# GREETINGS
label {
    monitor =
    text = Welcome!
    color = $text
    font_size = 55
    font_family = $font
    position = 165, 320
    halign = left
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text
    font_size = 40
    font_family = $font
    position = 255, 240
    halign = left
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=fr_FR.UTF-8 date +"%A %d %B")"
    color = $text
    font_size = 20
    font_family = $font
    position = 180, 175
    halign = left
    valign = center
}

# USER BOX
shape {
    monitor =
    size = 320, 55
    color = rgba(255, 255, 255, 0.2)
    rounding = -1
    border_size = 0
    position = 170, -140
    halign = left
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = rgba(205, 214, 224, 0.80)
    font_size = 16
    font_family = $font
    position = 281, -140
    halign = left
    valign = center
}

# PASSWORD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = -1
    font_family = $font
    placeholder_text = <i><span foreground="##ffffff99">🔒 Mot de passe</span></i>
    fail_text = $PAMFAIL
    position = 170, -220
    halign = left
    valign = center
}
